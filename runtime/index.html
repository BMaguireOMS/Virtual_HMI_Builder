<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>MyVirtualHMI</title>

<style>

body {

    margin: 0;

    background: #222;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#screen {

    position: relative;

    margin: auto;

    background: #d8eeee;

    overflow: hidden;
}

.runtime-object {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    box-sizing: border-box;
}

@keyframes hmiBlink {

    0% {
        opacity: 1;
    }

    50% {
        opacity: var(--blink-opacity, 0.2);
    }

    100% {
        opacity: 1;
    }
}

.blink-active {

    animation:
        hmiBlink
        var(--blink-speed, 0.8s)
        infinite;
}

.panel {
    border: 1px solid #c5cdd3;

    border-radius: 4px;

    box-sizing: border-box;
}

.button,
.nav,
.toggle {

    border:
        2px outset #d8eeee;

    cursor: pointer;

    touch-action: none;
}

.button:active,
.toggle:active {

    border:
        2px inset #d8eeee;
}

.num,
.input {

    border:
        1px solid #222;
}

.lamp {

    border-radius: 50%;

    border:
        2px solid #333;
}

.gauge {

    border-radius: 50%;

    border:
        8px solid #34495e;
}

.alarm {

    border:
        1px solid black;

    font-weight: bold;
}

.trend {

    border:
        1px solid #555;
}

</style>

</head>

<body>

<div id="screen"></div>

<script>

const project =
    {"name":"MyVirtualHMI","canvas":{"width":1280,"height":720},"opc":{"endpoint":"opc.tcp://10.200.200.45:4840","policy":"Basic256Sha256","mode":"SignAndEncrypt","username":"admin"},"screens":[{"name":"Main","objects":[{"id":"obj_fh6ublsg","type":"dropdown","name":"dropdown_1","text":"SELECT","dropdownMode":"navigation","dropdownOptions":[{"label":"Main","value":"Main"},{"label":"Secondary","value":"Secondary"}],"trueText":"RUNNING","falseText":"STOPPED","trueColor":"#2e9d58","falseColor":"#c83b3b","animateColor":false,"animateVisibility":false,"animateBlink":false,"blinkSpeed":0.8,"blinkOpacity":0.2,"x":50,"y":50,"w":180,"h":44,"z":11,"fontSize":20,"bg":"#ffffff","fg":"#17212b","node":"","binding":"none","dataType":"BOOL","buttonMode":"toggle","writeValue":"true","min":0,"max":100,"units":"","navTarget":""}]},{"name":"Secondary","objects":[{"id":"obj_qkfso49y","type":"dropdown","name":"dropdown_1_copy","text":"SELECT","dropdownMode":"navigation","dropdownOptions":[{"label":"Main","value":"Main"},{"label":"Secondary","value":"Secondary"}],"trueText":"RUNNING","falseText":"STOPPED","trueColor":"#2e9d58","falseColor":"#c83b3b","animateColor":false,"animateVisibility":false,"animateBlink":false,"blinkSpeed":0.8,"blinkOpacity":0.2,"x":70,"y":70,"w":180,"h":44,"z":12,"fontSize":20,"bg":"#ffffff","fg":"#17212b","node":"","binding":"none","dataType":"BOOL","buttonMode":"toggle","writeValue":"true","min":0,"max":100,"units":"","navTarget":""},{"id":"obj_hnxbcnjt","type":"label","name":"label_2","text":"Label","dropdownMode":"navigation","dropdownOptions":[{"label":"Main","value":"Main"}],"trueText":"RUNNING","falseText":"STOPPED","trueColor":"#2e9d58","falseColor":"#c83b3b","animateColor":false,"animateVisibility":false,"animateBlink":false,"blinkSpeed":0.8,"blinkOpacity":0.2,"x":190,"y":230,"w":160,"h":40,"z":13,"fontSize":20,"bg":"#eef2f4","fg":"#1b252d","node":"","binding":"none","dataType":"BOOL","buttonMode":"toggle","writeValue":"true","min":0,"max":100,"units":"","navTarget":""},{"id":"obj_n0jaure3","type":"label","name":"label_3","text":"Label","dropdownMode":"navigation","dropdownOptions":[{"label":"Main","value":"Main"}],"trueText":"RUNNING","falseText":"STOPPED","trueColor":"#2e9d58","falseColor":"#c83b3b","animateColor":false,"animateVisibility":false,"animateBlink":false,"blinkSpeed":0.8,"blinkOpacity":0.2,"x":470,"y":240,"w":160,"h":40,"z":14,"fontSize":20,"bg":"#eef2f4","fg":"#1b252d","node":"","binding":"none","dataType":"BOOL","buttonMode":"toggle","writeValue":"true","min":0,"max":100,"units":"","navTarget":""}]}],"currentScreen":"Secondary"};


let currentScreen =
    project.currentScreen;

// Contains the newest values received
// from the PLC.

let latestValues = {};

// ==========================================================
// DRAW SCREEN
// ==========================================================

function renderScreen() {

    const screen =
        project.screens.find(
            s =>
                s.name ===
                currentScreen
        );

    const root =
        document.getElementById(
            "screen"
        );

    root.innerHTML =
        "";

    root.style.width =
        project.canvas.width +
        "px";

    root.style.height =
        project.canvas.height +
        "px";

    screen.objects.forEach(
        obj => {

            let element;

            if (
    obj.type ===
    "input"
) {

    element =
        document.createElement(
            "input"
        );

    element.value =
        obj.text;

}

else if (
    obj.type ===
    "dropdown"
) {

    element =
        document.createElement(
            "select"
        );

    const options =
        obj.dropdownOptions || [];

    options.forEach(
        optionData => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                optionData.value;

            option.innerText =
                optionData.label;

            element.appendChild(
                option
            );
        }
    );

    // Navigation dropdown should show
    // the screen we are currently on
    if (
        obj.dropdownMode ===
        "navigation"
    ) {

        element.value =
            currentScreen;
    }
}

else {

    element =
        document.createElement(
            "div"
        );

    element.innerText =
        obj.text;
}

            element.className =
                "runtime-object " +
                obj.type;

            element.style.left =
                obj.x + "px";

            element.style.top =
                obj.y + "px";

            element.style.width =
                obj.w + "px";

            element.style.height =
                obj.h + "px";

            element.style.background =
                obj.bg;

            element.style.color =
                obj.fg;

            element.style.fontSize =
                obj.fontSize + "px";

            element.dataset.node =
                obj.node;

            element.dataset.binding =
                obj.binding;

            element.dataset.dtype =
                obj.dataType;

            element.dataset.objectId =
                obj.id;

            // ==============================================
            // NAVIGATION BUTTON
            // ==============================================

            if (
                obj.type ===
                "nav"
            ) {

                element.onclick =
                    () => {

                        if (
                            obj.navTarget
                        ) {

                            currentScreen =
                                obj.navTarget;

                            renderScreen();

                            updateDisplay();
                        }

                    };
            }
            
            // ==============================================
            // DROPDOWN
            // ==============================================

            if (
                obj.type ===
                "dropdown"
            ) {

                element.addEventListener(
                    "change",
                    () => {

                        // ----------------------------------
                        // NAVIGATION MODE
                        // ----------------------------------

                        if (
                            obj.dropdownMode ===
                            "navigation"
                        ) {

                            const targetScreen =
                                element.value;
                            
                            console.log(
                                "Dropdown target:",
                                targetScreen
                            );

                            console.log(
                                "Available screens:",
                                project.screens.map(
                                    screen => screen.name
                                )
                            );

                            const exists =
                                project.screens.some(
                                    screen =>
                                        screen.name ===
                                        targetScreen
                                );

                            if (exists) {

                                currentScreen =
                                    targetScreen;

                                renderScreen();

                                updateDisplay();
                            }

                            return;
                        }

                    }
                );
            }

            // ----------------------------------
            // PLC WRITE MODE
            // ----------------------------------

            if (
                obj.dropdownMode ===
                "write"
            ) {

                let value =
                    element.value;


                if (
                    obj.dataType ===
                    "BOOL"
                ) {

                    value =
                        String(value)
                            .toLowerCase() ===
                        "true";
                }

                else if (
                    obj.dataType ===
                    "DINT"
                ) {

                    value =
                        parseInt(value);
                }

                else if (
                    obj.dataType ===
                    "REAL" ||
                    obj.dataType ===
                    "LREAL"
                ) {

                    value =
                        parseFloat(value);
                }


                writePLCValue(
                    obj.node,
                    value,
                    obj.dataType
                );
            }

            // ==============================================
            // BOOL / WRITE BUTTONS
            // ==============================================

            if (
                obj.type ===
                "button" ||
                obj.type ===
                "toggle"
            ) {

                configureButton(
                    element,
                    obj
                );
            }

            // ==============================================
            // NUMERIC INPUT
            // ==============================================

            if (
                obj.type ===
                "input"
            ) {

                element.addEventListener(
                    "change",
                    () => {

                        let value =
                            element.value;


                        if (
                            obj.dataType ===
                            "DINT"
                        ) {

                            value =
                                parseInt(
                                    value
                                );
                        }

                        else if (
                            obj.dataType ===
                            "REAL" ||
                            obj.dataType ===
                            "LREAL"
                        ) {

                            value =
                                parseFloat(
                                    value
                                );
                        }

                        writePLCValue(
                            obj.node,
                            value,
                            obj.dataType
                        );
                    }
                );
            }

            root.appendChild(
                element
            );

        }
    );
}

// ==========================================================
// CONFIGURE BUTTON BEHAVIOR
// ==========================================================

function configureButton(
    element,
    obj
) {

    if (!obj.node) {
        return;
    }

    const mode =
        obj.buttonMode ||
        "toggle";

    // ------------------------------------------------------
    // TOGGLE
    // ------------------------------------------------------

    if (
        mode ===
        "toggle"
    ) {

        element.addEventListener(
            "click",
            async () => {

                const current =
                    Boolean(
                        latestValues[
                            obj.node
                        ]
                    );

                await writePLCValue(
                    obj.node,
                    !current,
                    "BOOL"
                );
            }
        );

        return;
    }

    // ------------------------------------------------------
    // SET TRUE
    // ------------------------------------------------------

    if (
        mode ===
        "setTrue"
    ) {

        element.addEventListener(
            "click",
            () => {

                writePLCValue(
                    obj.node,
                    true,
                    "BOOL"
                );
            }
        );

        return;
    }

    // ------------------------------------------------------
    // SET FALSE
    // ------------------------------------------------------

    if (
        mode ===
        "setFalse"
    ) {

        element.addEventListener(
            "click",
            () => {

                writePLCValue(
                    obj.node,
                    false,
                    "BOOL"
                );
            }
        );

        return;
    }

    // ------------------------------------------------------
    // MOMENTARY
    // ------------------------------------------------------

    if (
        mode ===
        "momentary"
    ) {

        const press =
            event => {

                event.preventDefault();

                writePLCValue(
                    obj.node,
                    true,
                    "BOOL"
                );
            };

        const release =
            event => {

                event.preventDefault();

                writePLCValue(
                    obj.node,
                    false,
                    "BOOL"
                );
            };

        element.addEventListener(
            "pointerdown",
            press
        );

        element.addEventListener(
            "pointerup",
            release
        );

        element.addEventListener(
            "pointercancel",
            release
        );

        element.addEventListener(
            "pointerleave",
            event => {

                if (
                    event.buttons !== 0
                ) {

                    release(event);
                }
            }
        );

        return;
    }

    // ------------------------------------------------------
    // GENERIC WRITE VALUE
    // ------------------------------------------------------

    element.addEventListener(
        "click",
        () => {

            let value =
                obj.writeValue;


            if (
                obj.dataType ===
                "BOOL"
            ) {

                value =
                    String(value)
                        .toLowerCase()
                        ===
                        "true";
            }

            else if (
                obj.dataType ===
                "DINT"
            ) {

                value =
                    parseInt(value);
            }

            else if (
                obj.dataType ===
                "REAL" ||
                obj.dataType ===
                "LREAL"
            ) {

                value =
                    parseFloat(value);
            }

            writePLCValue(
                obj.node,
                value,
                obj.dataType
            );
        }
    );
}

// ==========================================================
// WRITE VALUE TO PYTHON BACKEND
// ==========================================================

async function writePLCValue(
    node,
    value,
    dataType
) {

    if (!node) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/write",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                node:
                                    node,

                                value:
                                    value,

                                dataType:
                                    dataType
                            }
                        )
                }
            );

        const result =
            await response.json();

        if (
            !result.success
        ) {

            console.error(
                "PLC write failed:",
                result.error
            );
        }

    }

    catch (error) {

        console.error(
            "PLC write error:",
            error
        );
    }
}

// ==========================================================
// GET TAG VALUES FROM PYTHON
// ==========================================================

async function updateTags() {

    try {

        const response =
            await fetch(
                "/api/tags"
            );

        latestValues =
            await response.json();


        updateDisplay();

    }

    catch (error) {

        console.error(
            "PLC read error:",
            error
        );
    }
}

// ==========================================================
// UPDATE DISPLAYED VALUES
// ==========================================================

function updateDisplay() {

    document
        .querySelectorAll(
            "[data-node]"
        )
        .forEach(
            element => {

                const node =
                    element.dataset.node;


                if (
                    !node ||
                    !(node in latestValues)
                ) {

                    return;
                }

                const value =
                    latestValues[node];

                const objectId =
                    element.dataset.objectId;

                const obj =
                    project.screens
                        .flatMap(
                            s =>
                                s.objects
                        )
                        .find(
                            o =>
                                o.id ===
                                objectId
                        );

                if (!obj) {
                    return;
                }

                // ------------------------------------------
                // INPUT
                // ------------------------------------------

                if (
                    element.tagName ===
                    "INPUT"
                ) {

                    if (
                        document.activeElement
                        !==
                        element
                    ) {

                        element.value =
                            value;
                    }

                    return;
                }

                // ------------------------------------------
                // BUTTON
                // ------------------------------------------

                if (
                    obj.type ===
                    "button" ||
                    obj.type ===
                    "toggle"
                ) {

                    if (
                        obj.dataType ===
                        "BOOL"
                    ) {

                        element.dataset.state =
                            value
                            ? "true"
                            : "false";


                        if (value) {

                            element.style.boxShadow =
                                "inset 0 0 0 4px #36a852";

                        }

                        else {

                            element.style.boxShadow =
                                "none";
                        }
                    }

                    return;
                }

                // ------------------------------------------
                // LAMP
                // ------------------------------------------

                if (
                    obj.type ===
                    "lamp"
                ) {

                    element.style.background =
                        value
                        ? "#33cc55"
                        : "#777777";

                    return;
                }

                // ------------------------------------------
                // STATUS INDICATOR
                // ------------------------------------------

                if (
                    obj.type ===
                    "status"
                ) {

                    if (obj.dataType === "BOOL") {

                        if (value) {

                            element.innerText =
                                obj.trueText ||
                                "RUNNING";

                            element.style.background =
                                obj.trueColor ||
                                "#2e9d58";

                        } else {

                            element.innerText =
                                obj.falseText ||
                                "STOPPED";

                            element.style.background =
                                obj.falseColor ||
                                "#c83b3b";
                        }

                        element.style.color =
                            "#ffffff";
                    }

                    return;
                }

                // ------------------------------------------
                // GENERIC BOOL COLOR ANIMATION
                // ------------------------------------------

                if (
                    obj.animateColor === true &&
                    obj.dataType === "BOOL"
                ) {

                    element.style.background =
                        value
                            ? (obj.trueColor || "#2e9d58")
                            : (obj.falseColor || "#c83b3b");
                }

                // ------------------------------------------
                // GENERIC BOOL VISIBILITY ANIMATION
                // ------------------------------------------

                    if (
                        obj.animateVisibility === true &&
                        obj.dataType === "BOOL"
                    ) {

                        element.style.display =
                            value
                                ? "flex"
                                : "none";
                    }

                                if (
                    obj.animateBlink === true &&
                    obj.dataType === "BOOL"
                    ) {

                    if (value) {

                        const speed =
                            obj.blinkSpeed ?? 0.8;

                        const opacity =
                            obj.blinkOpacity ?? 0.2;


                        element.style.setProperty(
                            "--blink-speed",
                            speed + "s"
                        );

                        element.style.setProperty(
                            "--blink-opacity",
                            opacity
                        );

                        element.classList.add(
                            "blink-active"
                        );

                    } else {

                        element.classList.remove(
                            "blink-active"
                        );

                        element.style.opacity =
                            "1";
                    }
                }

                // ------------------------------------------
                // DROPDOWN
                // ------------------------------------------

                if (
                    obj.type ===
                    "dropdown"
                ) {

                    if (
                        obj.dropdownMode ===
                        "write"
                    ) {

                        element.value =
                            String(value);
                    }

                    return;
                }

                // ------------------------------------------
                // EVERYTHING ELSE
                // ------------------------------------------

                let displayValue =
                    value;

                if (
                    obj.units
                ) {

                    displayValue +=
                        " " +
                        obj.units;
                }

                element.innerText =
                    displayValue;

            }
        );
}

// ==========================================================
// START RUNTIME
// ==========================================================

renderScreen();

updateTags();

setInterval(
    updateTags,
    250
);

</script>
