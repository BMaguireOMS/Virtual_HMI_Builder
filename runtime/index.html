":"#ffffff","fg":"#111111","node":"","binding":"none","dataType":"BOOL","buttonMode":"toggle","writeValue":"true","min":0,"max":100,"units":"","navTarget":""},{"id":"obj_g99amj8w","type":"alarm","name":"alarm_2","text":"NO ACTIVE ALARMS","x":0,"y":0,"w":640,"h":50,"z":17,"fontSize":20,"bg":"#ffea00","fg":"#111111","node":"","binding":"none","dataType":"BOOL","buttonMode":"toggle","writeValue":"true","min":0,"max":100,"units":"","navTarget":""}]}],"currentScreen":"Secondary"};


let currentScreen =
    project.currentScreen;


// Contains the newest values received
// from the PLC.

let latestValues = {};


// ==========================================================
// DRAW SCREEN
// ==========================================================

function renderScreen() {

    const screen =
        project.screens.find(
            s =>
                s.name ===
                currentScreen
        );


    const root =
        document.getElementById(
            "screen"
        );


    root.innerHTML =
        "";


    root.style.width =
        project.canvas.width +
        "px";


    root.style.height =
        project.canvas.height +
        "px";


    screen.objects.forEach(
        obj => {

            let element;


            if (
                obj.type ===
                "input"
            ) {

                element =
                    document.createElement(
                        "input"
                    );

                element.value =
                    obj.text;

            }

            else {

                element =
                    document.createElement(
                        "div"
                    );

                element.innerText =
                    obj.text;
            }


            element.className =
                "runtime-object " +
                obj.type;


            element.style.left =
                obj.x + "px";

            element.style.top =
                obj.y + "px";

            element.style.width =
                obj.w + "px";

            element.style.height =
                obj.h + "px";

            element.style.background =
                obj.bg;

            element.style.color =
                obj.fg;

            element.style.fontSize =
                obj.fontSize + "px";


            element.dataset.node =
                obj.node;

            element.dataset.binding =
                obj.binding;

            element.dataset.dtype =
                obj.dataType;

            element.dataset.objectId =
                obj.id;


            // ==============================================
            // NAVIGATION BUTTON
            // ==============================================

            if (
                obj.type ===
                "nav"
            ) {

                element.onclick =
                    () => {

                        if (
                            obj.navTarget
                        ) {

                            currentScreen =
                                obj.navTarget;

                            renderScreen();

                            updateDisplay();
                        }

                    };
            }


            // ==============================================
            // BOOL / WRITE BUTTONS
            // ==============================================

            if (
                obj.type ===
                "button" ||
                obj.type ===
                "toggle"
            ) {

                configureButton(
                    element,
                    obj
                );
            }


            // ==============================================
            // NUMERIC INPUT
            // ==============================================

            if (
                obj.type ===
                "input"
            ) {

                element.addEventListener(
                    "change",
                    () => {

                        let value =
                            element.value;


                        if (
                            obj.dataType ===
                            "DINT"
                        ) {

                            value =
                                parseInt(
                                    value
                                );
                        }


                        else if (
                            obj.dataType ===
                            "REAL" ||
                            obj.dataType ===
                            "LREAL"
                        ) {

                            value =
                                parseFloat(
                                    value
                                );
                        }


                        writePLCValue(
                            obj.node,
                            value,
                            obj.dataType
                        );
                    }
                );
            }


            root.appendChild(
                element
            );

        }
    );
}


// ==========================================================
// CONFIGURE BUTTON BEHAVIOR
// ==========================================================

function configureButton(
    element,
    obj
) {

    if (!obj.node) {
        return;
    }


    const mode =
        obj.buttonMode ||
        "toggle";


    // ------------------------------------------------------
    // TOGGLE
    // ------------------------------------------------------

    if (
        mode ===
        "toggle"
    ) {

        element.addEventListener(
            "click",
            async () => {

                const current =
                    Boolean(
                        latestValues[
                            obj.node
                        ]
                    );


                await writePLCValue(
                    obj.node,
                    !current,
                    "BOOL"
                );
            }
        );

        return;
    }


    // ------------------------------------------------------
    // SET TRUE
    // ------------------------------------------------------

    if (
        mode ===
        "setTrue"
    ) {

        element.addEventListener(
            "click",
            () => {

                writePLCValue(
                    obj.node,
                    true,
                    "BOOL"
                );
            }
        );

        return;
    }


    // ------------------------------------------------------
    // SET FALSE
    // ------------------------------------------------------

    if (
        mode ===
        "setFalse"
    ) {

        element.addEventListener(
            "click",
            () => {

                writePLCValue(
                    obj.node,
                    false,
                    "BOOL"
                );
            }
        );

        return;
    }


    // ------------------------------------------------------
    // MOMENTARY
    // ------------------------------------------------------

    if (
        mode ===
        "momentary"
    ) {

        const press =
            event => {

                event.preventDefault();

                writePLCValue(
                    obj.node,
                    true,
                    "BOOL"
                );
            };


        const release =
            event => {

                event.preventDefault();

                writePLCValue(
                    obj.node,
                    false,
                    "BOOL"
                );
            };


        element.addEventListener(
            "pointerdown",
            press
        );


        element.addEventListener(
            "pointerup",
            release
        );


        element.addEventListener(
            "pointercancel",
            release
        );


        element.addEventListener(
            "pointerleave",
            event => {

                if (
                    event.buttons !== 0
                ) {

                    release(event);
                }
            }
        );


        return;
    }


    // ------------------------------------------------------
    // GENERIC WRITE VALUE
    // ------------------------------------------------------

    element.addEventListener(
        "click",
        () => {

            let value =
                obj.writeValue;


            if (
                obj.dataType ===
                "BOOL"
            ) {

                value =
                    String(value)
                        .toLowerCase()
                        ===
                        "true";
            }


            else if (
                obj.dataType ===
                "DINT"
            ) {

                value =
                    parseInt(value);
            }


            else if (
                obj.dataType ===
                "REAL" ||
                obj.dataType ===
                "LREAL"
            ) {

                value =
                    parseFloat(value);
            }


            writePLCValue(
                obj.node,
                value,
                obj.dataType
            );
        }
    );
}


// ==========================================================
// WRITE VALUE TO PYTHON BACKEND
// ==========================================================

async function writePLCValue(
    node,
    value,
    dataType
) {

    if (!node) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/write",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                node:
                                    node,

                                value:
                                    value,

                                dataType:
                                    dataType
                            }
                        )
                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            console.error(
                "PLC write failed:",
                result.error
            );
        }

    }

    catch (error) {

        console.error(
            "PLC write error:",
            error
        );
    }
}


// ==========================================================
// GET TAG VALUES FROM PYTHON
// ==========================================================

async function updateTags() {

    try {

        const response =
            await fetch(
                "/api/tags"
            );


        latestValues =
            await response.json();


        updateDisplay();

    }

    catch (error) {

        console.error(
            "PLC read error:",
            error
        );
    }
}


// ==========================================================
// UPDATE DISPLAYED VALUES
// ==========================================================

function updateDisplay() {

    document
        .querySelectorAll(
            "[data-node]"
        )
        .forEach(
            element => {

                const node =
                    element.dataset.node;


                if (
                    !node ||
                    !(node in latestValues)
                ) {

                    return;
                }


                const value =
                    latestValues[node];


                const objectId =
                    element.dataset.objectId;


                const obj =
                    project.screens
                        .flatMap(
                            s =>
                                s.objects
                        )
                        .find(
                            o =>
                                o.id ===
                                objectId
                        );


                if (!obj) {
                    return;
                }


                // ------------------------------------------
                // INPUT
                // ------------------------------------------

                if (
                    element.tagName ===
                    "INPUT"
                ) {

                    if (
                        document.activeElement
                        !==
                        element
                    ) {

                        element.value =
                            value;
                    }


                    return;
                }


                // ------------------------------------------
                // BUTTON
                // ------------------------------------------

                if (
                    obj.type ===
                    "button" ||
                    obj.type ===
                    "toggle"
                ) {

                    if (
                        obj.dataType ===
                        "BOOL"
                    ) {

                        element.dataset.state =
                            value
                            ? "true"
                            : "false";


                        if (value) {

                            element.style.boxShadow =
                                "inset 0 0 0 4px #36a852";

                        }

                        else {

                            element.style.boxShadow =
                                "none";
                        }
                    }


                    return;
                }


                // ------------------------------------------
                // LAMP
                // ------------------------------------------

                if (
                    obj.type ===
                    "lamp"
                ) {

                    element.style.background =
                        value
                        ? "#33cc55"
                        : "#777777";


                    return;
                }


                // ------------------------------------------
                // EVERYTHING ELSE
                // ------------------------------------------

                let displayValue =
                    value;


                if (
                    obj.units
                ) {

                    displayValue +=
                        " " +
                        obj.units;
                }


                element.innerText =
                    displayValue;

            }
        );
}


// ==========================================================
// START RUNTIME
// ==========================================================

renderScreen();

updateTags();

setInterval(
    updateTags,
    250
);

</script>
